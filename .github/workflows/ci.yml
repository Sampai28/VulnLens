name: VulnLens CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  sast-checks:
    name: SAST Scanner (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sast

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Check structure
        run: |
          echo "SAST directory exists"
          ls -la

  analytics-checks:
    name: Analytics Engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./analytics

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check structure
        run: |
          echo "Analytics directory exists"
          ls -la

  api-checks:
    name: API Layer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check structure
        run: |
          echo "API directory exists"
          ls -la

  ci-gate:
    name: CI Gate
    needs: [sast-checks, analytics-checks, api-checks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All checks passed!"