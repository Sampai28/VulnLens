name: VulnLens CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci-checks:
    name: All Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install SAST dependencies
        run: just sast-install

      - name: Lint SAST code
        run: just sast-lint

      - name: Run SAST tests
        run: just sast-test

      - name: Validate SAST against ground truth
        run: just sast-compare

      - name: Install analytics dependencies
        run: just analytics-install

      - name: Run analytics tests
        run: just analytics-test

      - name: Install status gate dependencies
        run: just status-install

      - name: Run status gate tests
        run: just status-test


  scan-upload:
    name: Upload for Scan
    needs: [ci-checks]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed JS and Python files
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.js
            **/*.py

      - name: Post pending commit status
        if: steps.changed.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }} \
            -f state=pending \
            -f description="VulnLens scan in progress..." \
            -f context=vulnlens/scan

      - name: Upload changed files to S3
        if: steps.changed.outputs.any_changed == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          SCAN_ID=$(uuidgen)
          OWNER=${{ github.repository_owner }}
          REPO=$(echo ${{ github.repository }} | cut -d'/' -f2)
          for file in ${{ steps.changed.outputs.all_changed_files }}; do
            aws s3 cp "$file" "s3://vulnlens-uploads/${SCAN_ID}/${file}" \
              --metadata "owner=${OWNER},repo=${REPO},pr_number=${{ github.event.pull_request.number }},commit_sha=${{ github.event.pull_request.head.sha }}"
          done

  ci-gate:
    name: CI Gate
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All checks passed!"