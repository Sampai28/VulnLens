name: VulnLens CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci-checks:
    name: All Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install SAST dependencies
        run: just sast-install

      - name: Lint SAST code
        run: just sast-lint

      - name: Run SAST tests
        run: just sast-test

      - name: Validate SAST against ground truth
        run: just sast-compare

      - name: Install analytics dependencies
        run: just analytics-install

      - name: Run analytics tests
        run: just analytics-test


  ci-gate:
    name: CI Gate
    needs: [ci-checks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All checks passed!"