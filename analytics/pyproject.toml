[project]
name = "vulnlens-analytics"
version = "0.1.0"
description = "VulnLens analytics engine: risk scoring, CWE enrichment, DBSCAN clustering, and trend analysis."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Put the analytics dir on sys.path so tests can `from src.<module> import ...`,
# matching how the Lambda package is laid out (src/ at the zip root).
pythonpath = ["."]
testpaths = ["tests"]
